<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>长明：雾海迷宫</title>
  <style>
    :root {
      --night: #0b1a24;
      --ember: #ffb45c;
      --fog: #9fb0b5;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 35%, rgba(255, 180, 92, 0.08), transparent 55%),
        linear-gradient(180deg, #07131a 0%, var(--night) 55%, #050c11 100%);
      color: var(--fog);
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .placeholder {
      position: relative;
      z-index: 1;
      max-width: 560px;
      padding: 0 24px;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    body[data-ready="true"] .placeholder {
      opacity: 0;
      visibility: hidden;
    }
    .placeholder h1 {
      margin: 0 0 12px;
      color: #f6e7c8;
      font-family: Georgia, "Songti SC", "SimSun", serif;
      font-size: clamp(32px, 6vw, 56px);
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .placeholder p {
      margin: 0;
      font-size: 13px;
      line-height: 1.9;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="长明：雾海迷宫场景"></canvas>
  <div class="placeholder">
    <h1>长明</h1>
    <p>雾海迷宫 · 引擎骨架运行中<br>WebGL2 / three.js · 计算机图形学综合实验四</p>
  </div>
  <script
    src="./dist/bundle.js"
    onerror="document.querySelector('.placeholder p').textContent = '未找到 dist/bundle.js，请先运行 npm install 和 npm run build'"
  ></script>
</body>
</html>
